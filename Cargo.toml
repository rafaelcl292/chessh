[package]
name = "chessh"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29.0"
image = "0.25.10"
rand = "0.10.3"
ratatui = "0.30.2"
russh = "0.63.3"
serde = { version = "1.0.229", features = ["derive"] }
