[package]
name = "chessh"
version = "0.1.0"
edition = "2021"

[dependencies]
crossterm = "0.29.0"
image = "0.25.9"
rand = "0.9.2"
ratatui = "0.29.0"
russh = "0.57.0"
russh-keys = "0.49.2"
serde = { version = "1.0.228", features = ["derive"] }
shakmaty = "0.29.4"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
